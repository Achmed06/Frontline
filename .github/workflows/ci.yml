name: Build Frontline

on:
  push:
    branches: ["main", "work-052-import"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and production build
        run: pnpm run build

      - name: Validate built entry points
        run: |
          test -s dist/index.html
          test -s dist/duel.html
          grep -q "FRONTLINE" dist/index.html
          grep -q "FRONTLINE" dist/duel.html

      - name: Start preview
        run: |
          pnpm run preview -- --port 4173 > /tmp/frontline-vite.log 2>&1 &
          echo $! > /tmp/frontline-vite.pid

      - name: Preview smoke test
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/frontline-index.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/frontline-index.html || {
            cat /tmp/frontline-vite.log
            exit 1
          }

          grep -q "FRONTLINE" /tmp/frontline-index.html

          MAIN_JS="$(grep -oE '\./assets/main-[^"]+\.js' /tmp/frontline-index.html | head -1)"
          test -n "$MAIN_JS"
          curl -fsS "http://127.0.0.1:4173/${MAIN_JS#./}" > /tmp/frontline-main.js
          test -s /tmp/frontline-main.js

          curl -fsS http://127.0.0.1:4173/duel.html > /tmp/frontline-duel.html
          grep -q "FRONTLINE" /tmp/frontline-duel.html

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/frontline-vite.pid ]; then
            kill "$(cat /tmp/frontline-vite.pid)" 2>/dev/null || true
          fi
