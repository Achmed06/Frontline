name: Import and validate Work iOS

on:
  push:
    branches: ["ios-work-import"]
    paths:
      - ".frontline-ios-import/ready"

permissions:
  contents: write

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout iOS staging branch
        uses: actions/checkout@v4
        with:
          ref: ios-work-import
          fetch-depth: 0

      - name: Reconstruct exact Work iOS source
        run: |
          tr -d '\n\r ' < .frontline-ios-import/ios-source.b64 | base64 -D > /tmp/frontline-ios.tgz
          echo "6cb2ec4064f6dccc2cf54c0bed94970587b24e3bbb7bb9c4bdaf465a53a701b5  /tmp/frontline-ios.tgz" | shasum -a 256 -c -
          tar -xzf /tmp/frontline-ios.tgz

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sync Capacitor
        run: pnpm run ios:sync

      - name: Select Xcode 26.3 when available
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Compile native iPhone target without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath /tmp/frontline-native-check CODE_SIGNING_ALLOWED=NO build

      - name: Commit native Work project
        run: |
          rm -rf .frontline-ios-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ios
          git add -u .frontline-ios-import
          git commit -m "Import exact Frontline Work iOS project"
          git push origin HEAD:ios-work-import
