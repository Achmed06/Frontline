# iPhone test build. Unsigned IPA is produced for sideload signing; signed export remains optional.
name: iPhone test build
on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "ios/**"
      - "scripts/**"
      - "index.html"
      - "duel.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/ios-test.yml"
  workflow_dispatch:
    inputs:
      signed_ipa:
        description: Export a signed IPA using the ios-testing environment secrets
        type: boolean
        default: false
      export_method:
        description: Must match the supplied Apple provisioning profile
        type: choice
        options:
          - debugging
          - release-testing
        default: debugging
permissions:
  contents: read
concurrency:
  group: ios-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Test game logic
        run: pnpm run test
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: npm run ios:sync
      - name: Verify native version matches package release
        run: npm run version:check
      - name: Compile native iPhone target without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath releases/native-check CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP="releases/native-check/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          rm -rf releases/unsigned
          mkdir -p releases/unsigned/Payload
          cp -R "$APP" releases/unsigned/Payload/
          cd releases/unsigned
          /usr/bin/zip -qry Frontline-unsigned.ipa Payload
          test -s Frontline-unsigned.ipa
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/App.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/App.app/Info.plist)
          EXPECTED_VERSION=$(xcodebuild -project ../../ios/App/App.xcodeproj -scheme App -configuration Release -showBuildSettings | awk '/ MARKETING_VERSION = / {print $3; exit}')
          EXPECTED_BUILD=$(xcodebuild -project ../../ios/App/App.xcodeproj -scheme App -configuration Release -showBuildSettings | awk '/ CURRENT_PROJECT_VERSION = / {print $3; exit}')
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$BUILD" = "$EXPECTED_BUILD"
          echo "Packaged Frontline $VERSION ($BUILD)"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-unsigned-${{ github.run_number }}
          path: releases/unsigned/Frontline-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
  signed-ipa:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_ipa }}
    needs: native-build
    runs-on: macos-15
    timeout-minutes: 30
    environment: ios-testing
    env:
      TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      EXPORT_METHOD: ${{ inputs.export_method }}
      VITE_DUEL_SERVER_URL: ${{ vars.IOS_DUEL_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Export personal test IPA
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/ios-cloud-sign.sh
      - name: Keep only the installable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-iPhone-${{ github.run_number }}
          path: releases/ios/**/*.ipa
          if-no-files-found: error
          retention-days: 7
