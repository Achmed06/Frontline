name: Import exact Work runtime

on:
  push:
    branches: ["work-052-import"]
    paths:
      - ".frontline-import/ready"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: work-052-import
          fetch-depth: 0

      - name: Reconstruct exact Work runtime
        run: |
          cp -a .github /tmp/github-before-import

          tr -d '\n\r ' < .frontline-import/work-web-no-fonts.b64 | base64 -d > /tmp/frontline-web.tgz
          echo "f3c51d4fe64d3603a1ffb463936ad49cfb573b213a9c1fff091ebc333bbf19f4  /tmp/frontline-web.tgz" | sha256sum -c -

          tr -d '\n\r ' < .frontline-import/work-fonts.b64 | base64 -d > /tmp/frontline-fonts.tgz
          echo "5a0acccd0a1a4daa1f64908d020bdfc7ecb1bd89c9991ead3a53e6b77f03f57e  /tmp/frontline-fonts.tgz" | sha256sum -c -

          tar -xzf /tmp/frontline-web.tgz
          tar -xzf /tmp/frontline-fonts.tgz

          rm -rf .github
          cp -a /tmp/github-before-import .github

      - name: Validate production build
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Commit exact runtime
        run: |
          rm -rf .frontline-import
          rm -f .github/workflows/import-work-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import exact Frontline Work 0.52 runtime"
          git push origin HEAD:work-052-import
